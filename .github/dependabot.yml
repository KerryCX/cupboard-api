version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      fastapi:
        patterns:
          - "fastapi"
          - "starlette"
          - "pydantic"
          - "uvicorn"
      testing:
        patterns:
          - "pytest"
          - "httpx"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
